<h1>漢字書き取りテスト</h1>

<div id="settings">
    <div class="setting-item">
        範囲：<input type="number" id="range-start" value="1" min="1" max="20"> 〜 
        <input type="number" id="range-end" value="20" min="1" max="20">

    <div class="setting-item">
        問題数：<input type="number" id="question-count" value="10" min="1" max="20">
    </div>
    <button id="start-btn" onclick="startTest()">テスト開始！</button>
</div>

<div id="questions-list"></div>

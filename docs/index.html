<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字手書きテスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-area">
            <h1>漢字手書きテスト</h1>
        </div>

        <div id="settings" class="card">
            <h2>テスト設定</h2>
            
            <div class="setting-item">
                <label class="setting-label">出題範囲（開始）：</label>
                <div class="setting-inputs">
                    <select id="range-start-chapter"></select><span>章</span>
                    <select id="range-start-num"></select><span>番</span>
                </div>
            </div>

            <div class="setting-item">
                <label class="setting-label">出題範囲（終了）：</label>
                <div class="setting-inputs">
                    <select id="range-end-chapter"></select><span>章</span>
                    <select id="range-end-num"></select><span>番</span>
                </div>
            </div>

            <div class="setting-item">
                <label class="setting-label">出題問題数：</label>
                <div class="setting-inputs">
                    <input type="number" id="question-count" value="10" min="1"><span>問</span>
                </div>
            </div>

            <div class="setting-item dark-mode-row">
                <label class="dark-mode-text" for="dark-mode-toggle">ダークモードで取り組む場合はチェック</label>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button id="start-btn" class="btn">テスト開始</button>
        </div>

        <div id="questions-list"></div>

        <button id="finish-btn" class="btn" style="display:none;">答え合わせ</button>

        <div id="score-container" class="card" style="display:none;">
            <h2 id="score-text"></h2>
            <button onclick="location.reload()" class="btn">もう一度やる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

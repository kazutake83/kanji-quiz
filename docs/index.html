<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>漢字テスト対策</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="test-container">
        <h1>漢字テスト対策</h1>
        
        <div id="settings" class="card">
            <p class="instruction">範囲と問題数を決めて開始してください</p>
            <div class="setting-row">
                <span>範囲:</span>
                <input type="number" id="range-start" value="1" min="1"> 〜 
                <input type="number" id="range-end" value="20" min="1">
            </div>
            <div class="setting-row">
                <span>問題数:</span>
                <input type="number" id="question-count" value="5" min="1">
            </div>
            <button id="start-btn" onclick="startTest()">テスト開始！</button>
        </div>

        <div id="questions-list"></div>

        <div class="footer-controls">
            <button id="finish-btn" onclick="finishTest()" style="display:none;">答え合わせをする</button>
            <button id="reset-btn" onclick="location.reload()" style="display:none;">最初からやり直す</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

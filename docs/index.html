<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字手書きテスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-area">
            <h1>漢字手書きテスト</h1>
            <label class="switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div id="settings" class="card">
            <h2>テスト設定</h2>
            
            <div class="setting-item">
                <label>出題範囲（開始）：</label>
                <select id="range-start-chapter"></select> 章 
                <select id="range-start-num"></select> 番
            </div>

            <div class="setting-item">
                <label>出題範囲（終了）：</label>
                <select id="range-end-chapter"></select> 章 
                <select id="range-end-num"></select> 番
            </div>

            <div class="setting-item">
                <label>出題問題数：</label>
                <input type="number" id="question-count" value="10" min="1"> 問
            </div>

            <button id="start-btn" class="btn">テスト開始</button>
        </div>

        <div id="questions-list"></div>

        <button id="finish-btn" class="btn" style="display:none;">答え合わせ</button>

        <div id="score-container" class="card" style="display:none;">
            <h2 id="score-text"></h2>
            <button onclick="location.reload()" class="btn">もう一度やる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>漢字書き取りテスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="test-container">
        <h1>漢字書き取りテスト</h1>
        
        <div id="settings" class="card">
            <p class="instruction">設定を決めて開始してください</p>
            <div class="setting-row">
                <span>範囲:</span>
                <input type="number" id="range-start" value="1"> 〜 
                <input type="number" id="range-end" value="175">
            </div>
            <div class="setting-row">
                <span>問題数:</span>
                <input type="number" id="question-count" value="5">
            </div>
            <div class="setting-row">
                <label class="dark-mode-switch">
                    <input type="checkbox" id="dark-mode-toggle"> ダークモード
                </label>
            </div>
            <button id="start-btn">テスト開始！</button>
        </div>

        <div id="questions-list"></div>

        <div class="footer-controls">
            <button id="finish-btn" class="main-btn" style="display:none;">答え合わせをする</button>
            
            <div id="score-container" style="display:none;" class="card">
                <h2 id="score-text">結果：採点中...</h2>
                <p style="font-size: 14px; opacity: 0.8;">※○か×を押して採点してください</p>
                <button class="main-btn" onclick="location.reload()">もう一度テストする</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

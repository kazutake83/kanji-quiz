<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>20問 漢字書き取りテスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="test-container">
        <h1>漢字書き取りテスト (20問)</h1>
        <p class="instruction">下の枠に漢字を書いてください。最後にまとめて答え合わせができます。</p>
        
        <div id="questions-list"></div>

        <div class="footer-controls">
            <button id="finish-btn" onclick="finishTest()">答え合わせをする</button>
            <button id="reset-btn" onclick="location.reload()" style="display:none;">最初からやり直す</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

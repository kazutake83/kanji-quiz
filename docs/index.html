<div id="test-container">
    <h1>漢字書き取りテスト</h1>
    
    <div id="settings" class="card">
        <p class="instruction">設定を決めて開始してください</p>
        <div class="setting-row">
            <span>範囲:</span>
            <input type="number" id="range-start" value="1" min="1"> 〜 
            <input type="number" id="range-end" value="25" min="1">
        </div>
        <div class="setting-row">
            <span>問題数:</span>
            <input type="number" id="question-count" value="5" min="1">
        </div>
        <div class="setting-row">
            <label class="switch-label">
                <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()"> ダークモードにする
            </label>
        </div>
        <button id="start-btn" onclick="startTest()">テスト開始！</button>
    </div>

    <div id="questions-list"></div>

    <div class="footer-controls">
        <button id="finish-btn" onclick="finishTest()" style="display:none;">答え合わせをする</button>
        
        <div id="score-container" style="display:none;" class="card">
            <h2 id="score-text">結果：採点中...</h2>
            <p>※○か×を押して採点してください</p>
            <button id="reset-btn" onclick="location.reload()">もう一度テストする</button>
        </div>
    </div>
</div>
